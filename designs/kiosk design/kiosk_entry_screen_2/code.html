<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Barista Kiosk Entry - Face Scan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "surface-dark": "#192233",
                        "surface-dark-hover": "#232f48",
                        // Cafe Theme Extensions
                        "cafe-brown": "#6F4E37",
                        "cafe-brown-dark": "#4E3629",
                        "cafe-cream": "#FDFBF7",
                        "cafe-accent": "#D7CCC8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "2rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen w-full flex flex-col font-display overflow-hidden select-none">
<div class="layout-container flex h-full grow flex-col relative z-10">
<div class="px-6 md:px-40 flex flex-1 justify-center items-center py-10 h-full">
<div class="layout-content-container flex flex-col max-w-[640px] w-full flex-1 gap-12">
<div class="flex flex-col items-center text-center gap-6 animate-fade-in-down">
<div class="w-32 h-32 rounded-full overflow-hidden mb-2 shadow-2xl shadow-primary/20 ring-4 ring-surface-dark bg-surface-dark flex items-center justify-center">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="Barista Cafe Logo with steam coffee cup icon minimalist" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDvnBp2GP6OWSE9I2tbNTArJFte8KwiD00jfWP5OHhGBnndEzrK1KpILaUjLlfI0izq5CaF7nNnnDG52Camf7N_sN6onbr1ql0dxvNXpMU9R9cfGdX_30g6nh09U8QFtuCzkglVbfmhDf7mRvL9Y_bWDszcihQ6OVdWLvoS5c-ogo7Rnl7737c0CrjQxrf781sa1sVKy59X9fUJ4LRBK3Wmhtqgeb0G6QOdYQ0_HK26JHyh4i2hYvF9BG2BiaYwlOJdJuoP5hoUruQ");'>
</div>
</div>
<div class="flex flex-col gap-3">
<h1 class="text-slate-900 dark:text-white text-4xl md:text-5xl font-black leading-tight tracking-[-0.033em]">
                            Welcome to Barista
                        </h1>
<p class="text-slate-500 dark:text-[#92a4c9] text-lg md:text-xl font-medium leading-normal">
                            How would you like to order today?
                        </p>
</div>
</div>
<div class="flex flex-col gap-5 w-full">
<button class="group relative flex items-center justify-between gap-6 rounded-2xl bg-white dark:bg-surface-dark p-6 shadow-sm hover:shadow-md dark:shadow-[0_0_0_1px_rgba(255,255,255,0.05)] transition-all duration-200 active:scale-[0.98] border border-slate-200 dark:border-transparent text-left w-full h-[120px]">
<div class="flex items-center gap-6">
<div class="flex items-center justify-center w-16 h-16 rounded-xl bg-primary/10 dark:bg-[#232f48] text-primary group-hover:bg-primary group-hover:text-white transition-colors duration-300">
<span class="material-symbols-outlined !text-4xl">person</span>
</div>
<div class="flex flex-col gap-1">
<p class="text-slate-900 dark:text-white text-xl font-bold leading-tight">Guest Order</p>
<p class="text-slate-500 dark:text-[#92a4c9] text-base font-normal leading-normal">Skip login, just order</p>
</div>
</div>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-slate-100 dark:bg-[#232f48] text-slate-400 dark:text-slate-500 group-hover:bg-primary group-hover:text-white transition-all duration-300">
<span class="material-symbols-outlined">arrow_forward</span>
</div>
</button>
<button class="group relative flex items-center justify-between gap-6 rounded-2xl bg-white dark:bg-surface-dark p-6 shadow-sm hover:shadow-md dark:shadow-[0_0_0_1px_rgba(255,255,255,0.05)] transition-all duration-200 active:scale-[0.98] border border-slate-200 dark:border-transparent text-left w-full h-[120px]">
<div class="flex items-center gap-6">
<div class="flex items-center justify-center w-16 h-16 rounded-xl bg-purple-500/10 dark:bg-[#232f48] text-purple-600 dark:text-purple-400 group-hover:bg-purple-600 group-hover:text-white transition-colors duration-300">
<span class="material-symbols-outlined !text-4xl">face</span>
</div>
<div class="flex flex-col gap-1">
<p class="text-slate-900 dark:text-white text-xl font-bold leading-tight">Face Scan</p>
<p class="text-slate-500 dark:text-[#92a4c9] text-base font-normal leading-normal">Pay with your smile</p>
</div>
</div>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-slate-100 dark:bg-[#232f48] text-slate-400 dark:text-slate-500 group-hover:bg-purple-600 group-hover:text-white transition-all duration-300">
<span class="material-symbols-outlined">arrow_forward</span>
</div>
</button>
<button class="group relative flex items-center justify-between gap-6 rounded-2xl bg-white dark:bg-surface-dark p-6 shadow-sm hover:shadow-md dark:shadow-[0_0_0_1px_rgba(255,255,255,0.05)] transition-all duration-200 active:scale-[0.98] border border-slate-200 dark:border-transparent text-left w-full h-[120px]">
<div class="flex items-center gap-6">
<div class="flex items-center justify-center w-16 h-16 rounded-xl bg-emerald-500/10 dark:bg-[#232f48] text-emerald-600 dark:text-emerald-400 group-hover:bg-emerald-600 group-hover:text-white transition-colors duration-300">
<span class="material-symbols-outlined !text-4xl">key</span>
</div>
<div class="flex flex-col gap-1">
<p class="text-slate-900 dark:text-white text-xl font-bold leading-tight">Member Login</p>
<p class="text-slate-500 dark:text-[#92a4c9] text-base font-normal leading-normal">Earn points &amp; rewards</p>
</div>
</div>
<div class="flex items-center justify-center w-10 h-10 rounded-full bg-slate-100 dark:bg-[#232f48] text-slate-400 dark:text-slate-500 group-hover:bg-emerald-600 group-hover:text-white transition-all duration-300">
<span class="material-symbols-outlined">arrow_forward</span>
</div>
</button>
</div>
</div>
</div>
<div class="flex justify-center pb-8 opacity-60">
<p class="text-sm text-slate-500 dark:text-slate-600">v2.4.1 • Accessibility Options</p>
</div>
</div>
<div class="absolute inset-0 z-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute top-[40%] -right-[10%] w-[40%] h-[40%] bg-purple-500/5 rounded-full blur-[100px]"></div>
</div>
<div class="fixed inset-0 z-50 flex items-center justify-center p-4">
<div class="absolute inset-0 bg-background-dark/80 backdrop-blur-md transition-opacity"></div>
<div class="relative w-full max-w-[480px] bg-cafe-cream rounded-[2.5rem] shadow-2xl overflow-hidden flex flex-col ring-1 ring-white/10 animate-in fade-in zoom-in duration-300 scale-100">
<button class="absolute top-5 right-5 z-20 w-10 h-10 flex items-center justify-center rounded-full bg-black/5 hover:bg-black/10 text-cafe-brown-dark transition-colors">
<span class="material-symbols-outlined font-bold">close</span>
</button>
<div class="pt-8 pb-4 text-center px-6">
<h3 class="text-2xl font-black text-cafe-brown-dark tracking-tight mb-1">Face Scan</h3>
<p class="text-cafe-brown/80 text-sm font-medium">Position your face within the frame</p>
</div>
<div class="relative w-full aspect-[3/4] bg-neutral-900 overflow-hidden mx-auto">
<div class="absolute inset-0 bg-gradient-to-br from-neutral-800 to-neutral-900 opacity-80">
</div>
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100">
<defs>
<mask id="face-hole">
<rect fill="white" height="100%" width="100%"></rect>
<ellipse cx="50" cy="45" fill="black" rx="30" ry="38"></ellipse>
</mask>
</defs>
<rect fill="black" fill-opacity="0.5" height="100%" mask="url(#face-hole)" width="100%"></rect>
<ellipse cx="50" cy="45" fill="none" rx="30" ry="38" stroke="white" stroke-dasharray="2 1" stroke-opacity="0.7" stroke-width="0.5"></ellipse>
<path d="M 30,25 L 25,25 L 25,30" fill="none" stroke="white" stroke-linecap="round" stroke-width="0.8"></path>
<path d="M 70,25 L 75,25 L 75,30" fill="none" stroke="white" stroke-linecap="round" stroke-width="0.8"></path>
<path d="M 30,65 L 25,65 L 25,60" fill="none" stroke="white" stroke-linecap="round" stroke-width="0.8"></path>
<path d="M 70,65 L 75,65 L 75,60" fill="none" stroke="white" stroke-linecap="round" stroke-width="0.8"></path>
</svg>
<div class="absolute top-8 left-0 right-0 flex justify-center">
<div class="bg-black/40 backdrop-blur-sm px-3 py-1 rounded-full border border-white/10 flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
<span class="text-[10px] font-bold tracking-widest text-white uppercase">Live Camera</span>
</div>
</div>
</div>
<div class="p-6 pb-8 bg-cafe-cream flex flex-col gap-4 relative z-10">
<div class="hidden flex items-start gap-3 p-3 bg-red-50 border border-red-100 rounded-xl">
<span class="material-symbols-outlined text-red-700 text-xl shrink-0">error</span>
<div class="flex flex-col">
<span class="text-sm font-bold text-red-800">Face not detected</span>
<span class="text-xs text-red-600">Please remove masks or sunglasses.</span>
</div>
</div>
<button class="w-full h-16 rounded-2xl bg-cafe-brown hover:bg-cafe-brown-dark active:scale-[0.98] transition-all shadow-lg shadow-cafe-brown/20 flex items-center justify-center gap-3 group">
<span class="material-symbols-outlined text-white text-2xl group-hover:scale-110 transition-transform">camera</span>
<span class="text-white text-lg font-bold tracking-wide">Capture &amp; Recognize</span>
</button>
<p class="text-center text-xs text-cafe-brown/50">
                    By proceeding, you agree to our <a class="underline hover:text-cafe-brown" href="#">Privacy Policy</a>
</p>
</div>
</div>
</div>

</body></html>
